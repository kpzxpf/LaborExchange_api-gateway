server:
  port: 8080

spring:
  application:
    name: api-gateway

  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  jwt:
    secret: ${secret-jwt-key}

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**

        - id: role-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/roles/**

        - id: vacancy-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/vacancies/**

        - id: company-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/companies/**

        - id: resume-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/resumes/**

        - id: education-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/educations/**

        - id: search-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/search/**

        - id: application-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/applications/**

        - id: skill-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/skills/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.vlz: DEBUG

app:
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"

springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /api/auth/v3/api-docs
      - name: user-service
        url: /api/users/v3/api-docs
      - name: vacancy-service
        url: /api/vacancies/v3/api-docs
      - name: resume-service
        url: /api/resumes/v3/api-docs
      - name: application-service
        url: /api/applications/v3/api-docs
      - name: skill-service
        url: /api/skills/v3/api-docs
      - name: search-service
        url: /api/search/v3/api-docs

rate-limit:
  general:
    max-requests: 100
    window-ms: 60000
  auth:
    max-requests: 20
    window-ms: 60000